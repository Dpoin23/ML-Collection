[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]
"scripts/**" = ["E402", "T201"]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
